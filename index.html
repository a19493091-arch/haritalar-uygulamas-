<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yol Tarifi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Yol Tarifi Haritası</title>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<script src="lib/maplibre-gl.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --text:#1d2330; --muted:#6b7280; --line:#e3e6eb;
    --accent:#1a73e8; --accent-soft:#e8f0fe; --ok:#188038; --warn:#d93025;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111418; --panel:#1b1f25; --text:#e8eaed; --muted:#9aa0a6; --line:#2d333b;
      --accent:#8ab4f8; --accent-soft:#1f2a3a; --ok:#81c995; --warn:#f28b82; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;height:100dvh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  #app{display:flex;height:100%}
  #panel{width:380px;max-width:100%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;z-index:2}
  #map{flex:1}
  header{padding:calc(14px + env(safe-area-inset-top)) 16px 6px calc(16px + env(safe-area-inset-left));font-weight:700;font-size:18px}
  .scroll{overflow-y:auto;flex:1;padding:0 16px calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));-webkit-overflow-scrolling:touch}
  .point{display:flex;gap:6px;align-items:center;margin:6px 0;position:relative}
  .dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--accent)}
  .dot.start{background:var(--ok);border-color:var(--ok)}
  .dot.end{background:var(--warn);border-color:var(--warn)}
  .point input{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px}
  .point button.x{border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer}
  .sugg{position:absolute;left:18px;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:1000;max-height:240px;overflow:auto;box-shadow:0 4px 16px rgba(0,0,0,.15)}
  .sugg div{padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line)}
  .sugg div:hover{background:var(--accent-soft)}
  .row{display:flex;gap:8px;margin:10px 0}
  .btn{padding:10px 12px;min-height:42px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font-size:14px}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  @media (prefers-color-scheme: dark){ .btn.primary{color:#111} }
  .btn:disabled{opacity:.5;cursor:default}
  .modes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
  .mode{border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;cursor:pointer;font-size:12px;background:var(--panel)}
  .mode .ic{font-size:20px}
  .mode .t{font-weight:600;margin-top:2px;font-size:12px}
  .mode.active{border-color:var(--accent);background:var(--accent-soft)}
  .summary{background:var(--accent-soft);border-radius:10px;padding:12px;margin:8px 0}
  .summary .big{font-size:22px;font-weight:700}
  .muted{color:var(--muted);font-size:12px}
  ol.steps{list-style:none;padding:0;margin:8px 0}
  ol.steps li{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
  ol.steps li .ar{font-size:18px;width:24px;text-align:center}
  ol.steps li .d{margin-left:auto;color:var(--muted);white-space:nowrap;font-size:13px}
  #nav{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:1000;background:#0b5f2a;color:#fff;border-radius:14px;padding:12px 16px;min-width:300px;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none}
  #nav .next{font-size:20px;font-weight:700;display:flex;gap:10px;align-items:center}
  #nav .next .ar{font-size:30px}
  #nav .rest{font-size:14px;margin-top:6px;opacity:.9;display:flex;justify-content:space-between;align-items:center;gap:10px;white-space:nowrap}
  @media (max-width:760px){ #nav{left:12px;right:60px;transform:none;min-width:0;max-width:none} }
  #mapwrap{flex:1;position:relative}
  #mapwrap #map{position:absolute;inset:0}
  .err{color:var(--warn);font-size:13px;margin:6px 0}
  #viewSw{position:absolute;bottom:calc(44px + env(safe-area-inset-bottom));left:calc(12px + env(safe-area-inset-left));z-index:5;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  #viewSw button{border:none;background:none;color:var(--text);font-weight:700;font-size:15px;padding:9px 16px;cursor:pointer;min-height:40px}
  #viewSw button.on{background:var(--accent);color:#fff}
  @media (prefers-color-scheme: dark){ #viewSw button.on{color:#111} }
  #hint{position:absolute;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;background:rgba(20,24,30,.85);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;display:none;white-space:nowrap}
  .pin{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .pin.me{width:22px;height:22px;background:#1a73e8;box-shadow:0 0 0 6px rgba(26,115,232,.25),0 1px 4px rgba(0,0,0,.4)}
  .mbst{background:#d93025;color:#fff;font-size:12px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .maplibregl-ctrl-top-right{top:env(safe-area-inset-top);right:env(safe-area-inset-right)}
  #togglePanel{display:none;position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));right:14px;z-index:1000;border-radius:24px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
  /* Tablet */
  @media (min-width:761px) and (max-width:1100px){ #panel{width:330px} }
  /* Telefon (dikey) */
  @media (max-width:760px){
    #app{flex-direction:column-reverse}
    #panel{width:100%;height:55%;border-right:none;border-top:1px solid var(--line);transition:height .25s}
    header{padding-top:12px}
    #mapwrap{flex:1;min-height:45%}
    #togglePanel{display:block}
    body.collapsed #panel{height:0;border-top:none}
    .modes{gap:4px} .mode{font-size:11px}
  }
  /* Telefon yatay */
  @media (max-height:500px) and (orientation:landscape){
    #app{flex-direction:row} #panel{width:320px;height:100%;border-top:none;border-right:1px solid var(--line)}
    #togglePanel{display:block} body.collapsed #panel{width:0;height:100%}
  }
  /* Çift ekranlı cihazlar (Surface Duo vb.) – panel bir ekranda, harita diğerinde */
  @media (horizontal-viewport-segments:2){
    #app{flex-direction:row}
    #panel{width:env(viewport-segment-width 0 0, 50vw);height:100%;border-top:none}
    #mapwrap{margin-left:calc(env(viewport-segment-left 1 0, 50vw) - env(viewport-segment-width 0 0, 50vw))}
    #togglePanel{display:none}
  }
  @media (vertical-viewport-segments:2){
    #app{flex-direction:column-reverse}
    #panel{width:100%;height:env(viewport-segment-height 0 1, 50vh)}
    #mapwrap{flex:none;height:env(viewport-segment-height 0 0, 50vh);margin-bottom:calc(env(viewport-segment-top 0 1, 50vh) - env(viewport-segment-height 0 0, 50vh))}
    #togglePanel{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>🗺️ Yol Tarifi</header>
    <div class="scroll">
      <div id="points"></div>
      <div class="row">
        <button class="btn" id="addStop">＋ Durak ekle</button>
        <button class="btn" id="swap">⇅ Ters çevir</button>
        <button class="btn" id="myLoc" title="Konumum">📍</button>
      </div>
      <div class="muted">İpucu: Haritaya tıklayarak da boş kutuya nokta ekleyebilirsin.</div>

      <div class="modes" id="modes"></div>
      <button class="btn primary" id="go" style="width:100%">Rotayı Hesapla</button>
      <div id="error" class="err"></div>

      <div id="result" style="display:none">
        <div class="summary">
          <div class="big" id="sumTime"></div>
          <div id="sumDist"></div>
          <div class="muted" id="sumNote"></div>
        </div>
        <div class="row">
          <button class="btn primary" id="startNav">▶ Navigasyonu Başlat (GPS)</button>
          <button class="btn" id="simNav">Simüle et</button>
        </div>
        <b>Adım adım yol tarifi</b>
        <ol class="steps" id="steps"></ol>
      </div>
    </div>
  </aside>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="viewSw" role="group" aria-label="Harita görünümü">
      <button id="v2d" class="on" aria-pressed="true">2D</button>
      <button id="v3d" aria-pressed="false">3D</button>
    </div>
    <div id="hint"></div>
    <button class="btn primary" id="togglePanel">☰ Panel</button>
    <div id="nav">
      <div class="next"><span class="ar" id="navAr">⬆</span><span><span id="navDist"></span><br><span style="font-size:15px;font-weight:500" id="navText"></span></span></div>
      <div class="rest"><span id="navRemain"></span><span id="navEta"></span><button class="btn" id="stopNav" style="padding:2px 10px">Bitir</button></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const isSmall=()=>matchMedia("(max-width:760px), (max-height:500px)").matches;
/* ---------- Ayarlar ---------- */
const ROUTERS = {
  car:  "https://routing.openstreetmap.de/routed-car/route/v1/driving/",
  bike: "https://routing.openstreetmap.de/routed-bike/route/v1/driving/",
  foot: "https://routing.openstreetmap.de/routed-foot/route/v1/driving/"
};
const MODES = [
  {id:"car",  ic:"🚗", name:"Araç"},
  {id:"bus",  ic:"🚌", name:"Otobüs"},
  {id:"metrobus", ic:"🚍", name:"Metrobüs"},
  {id:"bike", ic:"🚲", name:"Bisiklet"},
  {id:"foot", ic:"🚶", name:"Yaya"}
];
// Metrobüs hattı (Beylikdüzü – Söğütlüçeşme) başlıca istasyonları, yaklaşık koordinatlar
const METROBUS = [
  ["Beylikdüzü Sondurak",40.9850,28.6380],["Cumhuriyet Mah.",40.9905,28.6600],["Haramidere",40.9940,28.6790],
  ["Avcılar Merkez",40.9800,28.7180],["Küçükçekmece",40.9930,28.7700],["Florya",40.9900,28.7950],
  ["Şirinevler",40.9940,28.8440],["Bahçelievler",40.9990,28.8620],["İncirli",41.0010,28.8750],
  ["Zeytinburnu",41.0070,28.8980],["Cevizlibağ",41.0150,28.9180],["Topkapı",41.0190,28.9290],
  ["Edirnekapı",41.0300,28.9370],["Halıcıoğlu",41.0420,28.9440],["Okmeydanı",41.0560,28.9660],
  ["Mecidiyeköy",41.0660,28.9930],["Zincirlikuyu",41.0680,29.0120],["15 Temmuz Şehitler Köprüsü",41.0450,29.0350],
  ["Altunizade",41.0220,29.0440],["Uzunçayır",40.9980,29.0400],["Söğütlüçeşme",40.9910,29.0370]
];
const SPEED = {bus:22, intercity:65, metrobus:38, walk:4.8}; // km/s ortalamaları (tahmin)
// Otobüs süresi: ilk 30 km şehir içi hızında, sonrası şehirlerarası otobüs hızında
function busSeconds(m){ const km=m/1000, city=Math.min(km,30), inter=Math.max(km-30,0);
  return (city/SPEED.bus + inter/SPEED.intercity)*3600 + (inter>0?15*60:0); }

/* ---------- Harita ---------- */
// Vektör harita: OpenFreeMap (OpenStreetMap verisi, anahtar gerektirmez). Bina yükseklikleri OSM'deki
// height / building:levels etiketlerinden gelir.
const map = new maplibregl.Map({
  container:"map", style:"https://tiles.openfreemap.org/styles/liberty",
  center:[29.0,41.0], zoom:8.5, maxPitch:0, attributionControl:{compact:true}
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),"top-right");
map.addControl(new maplibregl.ScaleControl({unit:"metric"}),"bottom-left");
const xy = ll => [ll[1], ll[0]];                     // [lat,lng] -> [lng,lat]
let mapReady=false; const readyQ=[];
const whenReady = f => mapReady ? f() : readyQ.push(f);
const EMPTY = {type:"FeatureCollection",features:[]};
const lineFC = (coords, props={}) => ({type:"FeatureCollection",features:coords?[{type:"Feature",properties:props,geometry:{type:"LineString",coordinates:coords.map(xy)}}]:[]});
let is3D=false;

map.on("load",()=>{
  const layers = map.getStyle().layers;
  // Bina verisinin hangi kaynakta olduğunu stilden bul (OpenMapTiles şeması: "building" katmanı)
  const bLayer = layers.find(l=>l["source-layer"]==="building");
  const bSource = bLayer ? bLayer.source : "openmaptiles";
  // Stilin kendi 3B bina katmanını kaldırıp kendi katmanımızı ekliyoruz
  layers.filter(l=>l.type==="fill-extrusion").forEach(l=>map.removeLayer(l.id));
  const firstSymbol = (map.getStyle().layers.find(l=>l.type==="symbol")||{}).id;
  map.addLayer({
    id:"bina-3d", type:"fill-extrusion", source:bSource, "source-layer":"building", minzoom:13,
    filter:["!=",["get","hide_3d"],true],
    layout:{visibility:"none"},
    paint:{
      "fill-extrusion-color":["interpolate",["linear"],["coalesce",["get","render_height"],8],
        0,"#e4dccf", 12,"#d6cbbb", 30,"#c2b6a6", 60,"#a9a9b6", 150,"#8b93a8"],
      "fill-extrusion-height":["interpolate",["linear"],["zoom"],13,0,14.5,["coalesce",["get","render_height"],8]],
      "fill-extrusion-base":["interpolate",["linear"],["zoom"],13,0,14.5,["coalesce",["get","render_min_height"],0]],
      "fill-extrusion-opacity":0.92,
      "fill-extrusion-vertical-gradient":true
    }
  }, firstSymbol);
  map.addSource("route",{type:"geojson",data:EMPTY});
  map.addSource("mbline",{type:"geojson",data:EMPTY});
  map.addLayer({id:"route-casing",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},
    paint:{"line-color":"#ffffff","line-width":["interpolate",["linear"],["zoom"],8,6,16,14],"line-opacity":.9}});
  map.addLayer({id:"route-line",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},
    paint:{"line-color":["get","color"],"line-width":["interpolate",["linear"],["zoom"],8,3.5,16,9]}});
  map.addLayer({id:"route-dash",type:"line",source:"route",filter:["==",["get","dash"],true],layout:{"line-cap":"round"},
    paint:{"line-color":"#ffffff","line-width":["interpolate",["linear"],["zoom"],8,1.5,16,4],"line-dasharray":[0.5,2.5]}});
  map.addLayer({id:"mb-line",type:"line",source:"mbline",layout:{"line-join":"round","line-cap":"round"},
    paint:{"line-color":"#d93025","line-width":["interpolate",["linear"],["zoom"],8,4,16,10],"line-opacity":.75}});
  mapReady=true; readyQ.splice(0).forEach(f=>f());
});
map.on("error",e=>{ if(!mapReady) showErr("Harita yüklenemedi. İnternet bağlantınızı kontrol edin."); });

let pinMarkers=[], extraMarkers=[], navMarker=null;
function pinEl(cls,color,title){ const el=document.createElement("div"); el.className="pin "+cls; if(color) el.style.background=color; if(title) el.title=title; return el; }
function fitTo(lls,padding=60,maxZoom=15){
  if(!lls.length) return;
  const b=new maplibregl.LngLatBounds(xy(lls[0]),xy(lls[0])); lls.forEach(ll=>b.extend(xy(ll)));
  const pad = isSmall() ? 30 : padding;
  map.fitBounds(b,{padding:pad,maxZoom,duration:800,pitch:is3D?55:0});
}

/* ---------- 2D / 3D ---------- */
function hint(t,ms=3500){ const h=$("hint"); h.textContent=t; h.style.display="block"; clearTimeout(hint.t); hint.t=setTimeout(()=>h.style.display="none",ms); }
function setView(three){
  is3D=three;
  $("v2d").classList.toggle("on",!three); $("v3d").classList.toggle("on",three);
  $("v2d").setAttribute("aria-pressed",!three); $("v3d").setAttribute("aria-pressed",three);
  whenReady(()=>{
    map.setLayoutProperty("bina-3d","visibility",three?"visible":"none");
    if(three){
      map.setMaxPitch(85);
      const z=map.getZoom();
      map.easeTo({pitch:60, bearing:map.getBearing()||-20, zoom: z<15 ? 16.2 : z, duration:1200});
      if(z<15) hint("Binalar 3B gösteriliyor · iki parmakla eğip döndürebilirsiniz");
      else hint("İki parmakla (veya sağ tık + sürükle) eğip döndürebilirsiniz");
    }else{
      map.easeTo({pitch:0, bearing:0, duration:800});
      setTimeout(()=>map.setMaxPitch(0),850);
    }
  });
}
$("v2d").onclick=()=>setView(false);
$("v3d").onclick=()=>setView(true);
map.on("zoomend",()=>{ if(is3D && map.getZoom()<13) hint("3B binaları görmek için yakınlaştırın"); });

/* ---------- Durum ---------- */
let points = [ {text:"", ll:null}, {text:"", ll:null} ];
let mode = "car";
let lastRoute = null;   // {coords, steps, distance, duration}
let navWatch = null, simTimer = null;

/* ---------- Yardımcılar ---------- */
function fmtDist(m){ return m >= 1000 ? (m/1000).toFixed(m>=10000?0:1).replace(".",",")+" km" : Math.round(m/10)*10+" m"; }
function fmtTime(s){
  const t = Math.round(s/60); const h = Math.floor(t/60), mn = t%60;
  return h ? `${h} sa ${mn} dk` : `${Math.max(mn,1)} dk`;
}
function hav(a,b){ // metre
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b[0]-a[0]), dLon=toR(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function bearingOf(a,b){ const toR=x=>x*Math.PI/180, toD=x=>x*180/Math.PI;
  const y=Math.sin(toR(b[1]-a[1]))*Math.cos(toR(b[0]));
  const x=Math.cos(toR(a[0]))*Math.sin(toR(b[0]))-Math.sin(toR(a[0]))*Math.cos(toR(b[0]))*Math.cos(toR(b[1]-a[1]));
  return (toD(Math.atan2(y,x))+360)%360; }
function debounce(f,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>f(...a),ms); }; }

/* ---------- Nokta kutuları ---------- */
function renderPoints(){
  const box = $("points"); box.innerHTML = "";
  points.forEach((p,i)=>{
    const last = i===points.length-1;
    const div = document.createElement("div"); div.className="point";
    const ph = i===0 ? "Nereden? (örn. Büyükçekmece)" : last ? "Nereye? (örn. Sapanca)" : `Durak ${i}`;
    div.innerHTML = `<span class="dot ${i===0?"start":last?"end":""}"></span>
      <input value="${p.text.replace(/"/g,"&quot;")}" placeholder="${ph}" autocomplete="off">
      ${(i>0 && !last) ? '<button class="x" title="Durağı sil">✕</button>' : ""}`;
    const inp = div.querySelector("input");
    const sugg = document.createElement("div"); sugg.className="sugg"; sugg.style.display="none"; div.appendChild(sugg);
    inp.addEventListener("input", debounce(()=>search(inp.value,sugg,i),400));
    inp.addEventListener("input", ()=>{ points[i].text=inp.value; points[i].ll=null; });
    inp.addEventListener("blur", ()=>setTimeout(()=>sugg.style.display="none",200));
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const f=sugg.firstChild; if(f) f.click(); else calc(); }});
    const x = div.querySelector(".x"); if(x) x.onclick=()=>{ points.splice(i,1); renderPoints(); drawMarkers(); };
    box.appendChild(div);
  });
}
async function geocode(q){
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=tr&accept-language=tr&q="+encodeURIComponent(q);
  const r = await fetch(url); return r.json();
}
async function search(q,sugg,i){
  if(q.trim().length<3){ sugg.style.display="none"; return; }
  try{
    const res = await geocode(q);
    sugg.innerHTML="";
    res.forEach(r=>{
      const d=document.createElement("div"); d.textContent=r.display_name;
      d.onmousedown = e=>e.preventDefault();
      d.onclick=()=>{ points[i]={text:r.display_name.split(",").slice(0,3).join(","), ll:[+r.lat,+r.lon]};
        sugg.style.display="none"; renderPoints(); drawMarkers(); };
      sugg.appendChild(d);
    });
    sugg.style.display = res.length ? "block" : "none";
  }catch(e){ sugg.style.display="none"; }
}
function drawMarkers(){
  pinMarkers.forEach(m=>m.remove()); pinMarkers=[];
  points.forEach((p,i)=>{ if(!p.ll) return;
    const last=i===points.length-1;
    const color = i===0?"#188038":last?"#d93025":"#1a73e8";
    const title = i===0?"Başlangıç":last?"Varış":`Durak ${i}`;
    pinMarkers.push(new maplibregl.Marker({element:pinEl("",color,title)}).setLngLat(xy(p.ll))
      .setPopup(new maplibregl.Popup({offset:12,closeButton:false}).setText(title+": "+p.text)).addTo(map));
  });
  const lls=points.filter(p=>p.ll).map(p=>p.ll);
  if(lls.length && !lastRoute) fitTo(lls,80,13);
}
map.on("click", async ev=>{
  const e={latlng:{lat:ev.lngLat.lat,lng:ev.lngLat.lng}};
  const idx = points.findIndex(p=>!p.ll); const i = idx<0 ? points.length-1 : idx;
  points[i] = {text:`${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`, ll:[e.latlng.lat,e.latlng.lng]};
  renderPoints(); drawMarkers();
  try{
    const r = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&accept-language=tr&lat=${e.latlng.lat}&lon=${e.latlng.lng}`)).json();
    if(r.display_name){ points[i].text=r.display_name.split(",").slice(0,3).join(","); renderPoints(); }
  }catch(_){}
});
$("addStop").onclick=()=>{ points.splice(points.length-1,0,{text:"",ll:null}); renderPoints(); };
$("swap").onclick=()=>{ points.reverse(); renderPoints(); drawMarkers(); };
$("myLoc").onclick=()=>{
  navigator.geolocation.getCurrentPosition(p=>{
    points[0]={text:"Konumum",ll:[p.coords.latitude,p.coords.longitude]}; renderPoints(); drawMarkers();
  },()=>showErr("Konum alınamadı. Tarayıcı izni gerekli."));
};

/* ---------- Modlar ---------- */
const modeTimes = {};
function renderModes(){
  $("modes").innerHTML = MODES.map(m=>`<div class="mode ${m.id===mode?"active":""}" data-m="${m.id}">
    <div class="ic">${m.ic}</div><div>${m.name}</div><div class="t">${modeTimes[m.id]||"–"}</div></div>`).join("");
  document.querySelectorAll(".mode").forEach(el=>el.onclick=()=>{ mode=el.dataset.m; renderModes(); if(points.every(p=>p.ll)) calc(); });
}

/* ---------- Rota ---------- */
function showErr(t){ $("error").textContent=t||""; }
async function resolvePoints(){
  for(const p of points){
    if(!p.ll){
      if(!p.text.trim()) throw new Error("Lütfen tüm kutuları doldurun veya boş durakları silin.");
      const r = await geocode(p.text);
      if(!r.length) throw new Error(`"${p.text}" bulunamadı.`);
      p.ll=[+r[0].lat,+r[0].lon];
    }
  }
}
async function osrm(profile, lls){
  const c = lls.map(p=>`${p[1]},${p[0]}`).join(";");
  const r = await fetch(`${ROUTERS[profile]}${c}?overview=full&geometries=geojson&steps=true`);
  const j = await r.json();
  if(j.code!=="Ok") throw new Error("Rota bulunamadı.");
  const rt = j.routes[0];
  const steps = rt.legs.flatMap((leg,li)=>leg.steps.map(s=>({...s, leg:li})));
  return {coords: rt.geometry.coordinates.map(c=>[c[1],c[0]]), steps, distance: rt.distance, duration: rt.duration, legs: rt.legs.length};
}
function nearestStation(ll){
  let best=null; METROBUS.forEach((s,i)=>{ const d=hav(ll,[s[1],s[2]]); if(!best||d<best.d) best={i,d,name:s[0],ll:[s[1],s[2]]}; });
  return best;
}
function lineDist(i,j){ let d=0; const [a,b]=i<j?[i,j]:[j,i];
  for(let k=a;k<b;k++) d+=hav([METROBUS[k][1],METROBUS[k][2]],[METROBUS[k+1][1],METROBUS[k+1][2]])*1.15; return d; }

// Toplu taşıma tahmini (gerçek sefer verisi değildir)
function transitEstimate(kind, carRoute){
  const D = carRoute.distance;
  const stopsCount = points.length-2;
  if(kind==="bus"){
    const wait = 8*60 + stopsCount*8*60;
    const walk = 600/ (SPEED.walk/3.6);
    return {duration: busSeconds(D) + wait + walk,
      note: D>30000
        ? `Tahmini: şehir içinde ${SPEED.bus} km/s, şehirlerarası otobüste ${SPEED.intercity} km/s; bekleme, aktarma ve ~600 m yürüme dahil.`
        : `Tahmini: ortalama ${SPEED.bus} km/s otobüs hızı, ~8 dk bekleme ve ~600 m yürüme dahil. Aktarma gerekebilir.`};
  }
  // metrobüs
  const a=points[0].ll, b=points[points.length-1].ll;
  const s1=nearestStation(a), s2=nearestStation(b);
  if(s1.i===s2.i) return {duration:null, note:"Metrobüs bu güzergâh için uygun değil (aynı istasyona en yakın)."};
  const mbDist = lineDist(s1.i,s2.i);
  const toSt = s1.d*1.3, fromSt = s2.d*1.3;
  const legTime = d => d<1200 ? d/(SPEED.walk/3.6) : busSeconds(d)+7*60;
  const t = legTime(toSt) + 4*60 + mbDist/(SPEED.metrobus/3.6) + legTime(fromSt);
  return {duration:t,
    note:`Tahmini: ${s1.name} → ${s2.name} metrobüs (~${fmtDist(mbDist)}). İstasyona ${fmtDist(toSt)}, istasyondan varışa ${fmtDist(fromSt)} ${fromSt>1200||toSt>1200?"(otobüs/aktarma ile)":"yürüme"}.`,
    stations:[s1,s2]};
}

async function calc(){
  showErr(""); stopNav();
  $("go").disabled=true; $("go").textContent="Hesaplanıyor…";
  try{
    await resolvePoints(); drawMarkers();
    const lls = points.map(p=>p.ll);
    const [car,bike,foot] = await Promise.all(["car","bike","foot"].map(p=>osrm(p,lls).catch(()=>null)));
    if(!car) throw new Error("Rota sunucusuna ulaşılamadı veya rota yok.");
    const bus = transitEstimate("bus",car), mb = transitEstimate("metrobus",car);
    modeTimes.car=fmtTime(car.duration);
    modeTimes.bike=bike?fmtTime(bike.duration):"–";
    modeTimes.foot=foot?fmtTime(foot.duration):"–";
    modeTimes.bus="~"+fmtTime(bus.duration);
    modeTimes.metrobus=mb.duration?"~"+fmtTime(mb.duration):"Yok";
    renderModes();

    const routes={car,bike,foot,bus:car,metrobus:car};
    let r = routes[mode] || car;
    let dur = r.duration, note = "";
    if(mode==="bus"){ dur=bus.duration; note=bus.note; }
    if(mode==="metrobus"){ dur=mb.duration; note=mb.note; }
    if(mode==="bike" && !bike){ r=car; note="Bisiklet rotası alınamadı; araç rotası gösteriliyor."; }
    if(mode==="foot" && !foot){ r=car; note="Yaya rotası alınamadı; araç rotası gösteriliyor."; }
    lastRoute = r;

    const color = {car:"#1a73e8",bike:"#188038",foot:"#a142f4",bus:"#e37400",metrobus:"#d93025"}[mode];
    extraMarkers.forEach(m=>m.remove()); extraMarkers=[];
    let seg=null;
    if(mode==="metrobus" && mb.stations){
      const [a,b]=mb.stations; seg=METROBUS.slice(Math.min(a.i,b.i),Math.max(a.i,b.i)+1).map(s=>[s[1],s[2]]);
      [a,b].forEach(s=>{ const el=document.createElement("div"); el.className="mbst"; el.textContent="🚍 "+s.name;
        extraMarkers.push(new maplibregl.Marker({element:el,anchor:"bottom",offset:[0,-6]}).setLngLat(xy(s.ll)).addTo(map)); });
    }
    whenReady(()=>{
      map.getSource("route").setData(lineFC(r.coords,{color,dash:mode==="foot"}));
      map.getSource("mbline").setData(lineFC(seg));
    });
    fitTo(r.coords,60,15);

    $("result").style.display="block";
    $("sumTime").textContent = dur ? fmtTime(dur) : "Uygun değil";
    const arrive = dur ? new Date(Date.now()+dur*1000).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}) : "";
    $("sumDist").textContent = `${fmtDist(r.distance)}${arrive?" · Varış ≈ "+arrive:""}${points.length>2?` · ${points.length-2} durak`:""}`;
    $("sumNote").textContent = note;
    renderSteps(r);
  }catch(e){ showErr(e.message); }
  $("go").disabled=false; $("go").textContent="Rotayı Hesapla";
}

/* ---------- Adım çevirisi ---------- */
const MOD_TR = {left:"sola",right:"sağa","slight left":"hafif sola","slight right":"hafif sağa","sharp left":"keskin sola","sharp right":"keskin sağa",straight:"düz",uturn:"U dönüşü"};
const ARROW = {left:"⬅",right:"➡","slight left":"↖","slight right":"↗","sharp left":"↙","sharp right":"↘",straight:"⬆",uturn:"↩"};
function stepText(s){
  const m=s.maneuver, mod=m.modifier, yol = s.name ? `${s.name}` : "";
  const on = yol ? ` ${yol} üzerine` : "";
  switch(m.type){
    case "depart": return `Yola çık${yol?" ("+yol+")":""}`;
    case "arrive": return s.leg < (lastRoute?.legs||1)-1 ? `Durak ${s.leg+1}'e ulaştınız` : "Varış noktasına ulaştınız";
    case "roundabout": case "rotary": return `Dönel kavşaktan ${m.exit?m.exit+". çıkıştan":""} çık${on}`;
    case "exit roundabout": case "exit rotary": return `Dönel kavşaktan çık${on}`;
    case "merge": return `Şeride katıl${on}`;
    case "on ramp": return `Bağlantı yoluna gir${mod?" ("+(MOD_TR[mod]||"")+")":""}${yol?" – "+yol:""}`;
    case "off ramp": return `Çıkışı kullan${mod?" ("+(MOD_TR[mod]||"")+")":""}${yol?" – "+yol:""}`;
    case "fork": return `Çatalda ${MOD_TR[mod]||""} devam et${yol?" – "+yol:""}`;
    case "end of road": return `Yolun sonunda ${MOD_TR[mod]||""} dön${on}`;
    case "continue": case "new name": return mod==="straight"||!mod ? `Düz devam et${yol?" – "+yol:""}` : `${cap(MOD_TR[mod])} devam et${yol?" – "+yol:""}`;
    default:
      if(mod==="straight") return `Düz devam et${yol?" – "+yol:""}`;
      if(mod==="uturn") return `U dönüşü yap${yol?" – "+yol:""}`;
      return `${cap(MOD_TR[mod]||"")} dön${on}`;
  }
}
const cap = s => s ? s[0].toLocaleUpperCase("tr-TR")+s.slice(1) : "";
function stepArrow(s){ const m=s.maneuver;
  if(m.type==="arrive") return "🏁"; if(m.type==="depart") return "🚩";
  if(m.type==="roundabout"||m.type==="rotary") return "🔄";
  return ARROW[m.modifier]||"⬆"; }
function renderSteps(r){
  const ol=$("steps"); ol.innerHTML="";
  r.steps.forEach(s=>{
    if(s.maneuver.type==="arrive" && s.leg<r.legs-1 && false) return;
    const li=document.createElement("li");
    li.innerHTML=`<span class="ar">${stepArrow(s)}</span><span>${stepText(s)}</span><span class="d">${s.distance?fmtDist(s.distance):""}</span>`;
    li.onclick=()=>{ map.flyTo({center:s.maneuver.location,zoom:17,pitch:is3D?60:0,bearing:is3D?(s.maneuver.bearing_after||0):0}); if(isSmall()){document.body.classList.add("collapsed");fixSize();} };
    ol.appendChild(li);
  });
}

/* ---------- Navigasyon (kalan km / m, sonraki dönüş) ---------- */
function startNav(useSim){
  if(!lastRoute) return;
  stopNav(); $("nav").style.display="block";
  if(isSmall()){ document.body.classList.add("collapsed"); fixSize(); }
  const r=lastRoute;
  // her adım için rota boyunca kümülatif başlangıç mesafesi
  const cum=[0]; for(let i=1;i<r.coords.length;i++) cum[i]=cum[i-1]+hav(r.coords[i-1],r.coords[i]);
  const total=cum[cum.length-1];
  const stepPos=[]; let acc=0; r.steps.forEach(s=>{ stepPos.push(acc); acc+=s.distance; });
  const scale = total/ (acc||total);
  const speedRatio = r.duration/r.distance; // s/m
  const durOverride = mode==="bus"||mode==="metrobus" ? null : null;

  function update(ll){
    // en yakın rota noktası
    let bi=0,bd=Infinity;
    for(let i=0;i<r.coords.length;i++){ const d=hav(ll,r.coords[i]); if(d<bd){bd=d;bi=i;} }
    const done=cum[bi], remain=total-done;
    let k = stepPos.findIndex(p=>p*scale>done+5); if(k<0) k=r.steps.length-1;
    const next=r.steps[k];
    const toTurn=Math.max(0,stepPos[k]*scale-done);
    $("navAr").textContent=stepArrow(next);
    $("navDist").textContent= toTurn<15 ? "Şimdi" : fmtDist(toTurn)+" sonra";
    $("navText").textContent=stepText(next);
    $("navRemain").textContent="Kalan: "+fmtDist(remain);
    const sec=remain*speedRatio;
    $("navEta").textContent=fmtTime(sec)+" · "+new Date(Date.now()+sec*1000).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
    if(!navMarker) navMarker=new maplibregl.Marker({element:pinEl("me")}).setLngLat(xy(ll)).addTo(map);
    navMarker.setLngLat(xy(ll));
    // takip kamerası: 3B modda yön rotaya göre döner
    const ahead=r.coords[Math.min(bi+3,r.coords.length-1)];
    const brg = ahead && hav(ll,ahead)>3 ? bearingOf(ll,ahead) : map.getBearing();
    const cam={center:xy(ll), bearing: is3D?brg:0, pitch: is3D?60:0, zoom: Math.max(map.getZoom(), is3D?16.5:15),
      padding:{top: is3D ? Math.round(map.getContainer().clientHeight*0.35) : 0, bottom:0, left:0, right:0}};
    if(useSim) map.jumpTo(cam); else map.easeTo({...cam, duration:900});
    if(bd>80 && !useSim) $("navDist").textContent="Rotadan çıktınız – "+$("navDist").textContent;
    if(remain<20){ $("navText").textContent="Varış noktasına ulaştınız 🎉"; $("navDist").textContent=""; }
  }
  if(useSim){
    let i=0;
    const stride=Math.max(1,Math.floor(r.coords.length/400));
    simTimer=setInterval(()=>{ i=Math.min(i+stride,r.coords.length-1); update(r.coords[i]);
      if(i>=r.coords.length-1) clearInterval(simTimer); },250);
  }else{
    if(!navigator.geolocation){ showErr("Tarayıcı konumu desteklemiyor."); return; }
    navWatch=navigator.geolocation.watchPosition(p=>{ const ll=[p.coords.latitude,p.coords.longitude]; update(ll); },
      ()=>showErr("Konum izni verilmedi. 'Simüle et' ile deneyebilirsiniz."),{enableHighAccuracy:true});
  }
}
function stopNav(){
  if(navWatch!==null){ navigator.geolocation.clearWatch(navWatch); navWatch=null; }
  if(simTimer){ clearInterval(simTimer); simTimer=null; }
  if(navMarker){ navMarker.remove(); navMarker=null; }
  map.easeTo({padding:{top:0,bottom:0,left:0,right:0},duration:300});
  $("nav").style.display="none";
}
$("go").onclick=calc;
$("startNav").onclick=()=>startNav(false);
$("simNav").onclick=()=>startNav(true);
$("stopNav").onclick=stopNav;

/* ---------- Cihaz uyumu ---------- */
const fixSize=()=>setTimeout(()=>map.resize(),300);
$("togglePanel").onclick=()=>{ document.body.classList.toggle("collapsed"); fixSize(); };
window.addEventListener("resize",fixSize);
window.addEventListener("orientationchange",fixSize);
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

/* ---------- Başlat ---------- */
points=[{text:"Büyükçekmece, İstanbul",ll:null},{text:"Sapanca, Sakarya",ll:null}];
renderPoints(); renderModes();
</script>
